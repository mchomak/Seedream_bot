services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seedream
      POSTGRES_USER: seedream_user
      POSTGRES_PASSWORD: seedream_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seedream_user -d seedream"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  bot:
    build: .
    command: python main.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://seedream_user:seedream_pass@postgres:5432/seedream
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  admin:
    build: .
    command: python admin_panel.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://seedream_user:seedream_pass@postgres:5432/seedream
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
